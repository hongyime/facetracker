services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: facetracker-postgres
    environment:
      POSTGRES_DB: facetracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ${POSTGRES_DATA_PATH:-./postgres_data}:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: facetracker-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    restart: unless-stopped

  api:
    build: .
    container_name: facetracker-api
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FACE_STORAGE_ROOT=/app/storage
    volumes:
      - ${HOST_FACE_STORAGE:-Y:/faces}:/app/storage:rw
      - ${APP_ROOT:-C:/facetracker}:/app/code:ro
      - ${APP_ROOT:-C:/facetracker}/src:/app/src:ro
      - model_cache:/root/.insightface/models
      # Physical drive mounts for scanning.
      # Conservative first-run scope: only Y: (face storage drive).
      # Re-enable C: / Z: once you trust the pipeline and have the patience
      # for a multi-drive full crawl.
      # - C:/:/mnt/c:ro
      # - Z:/:/mnt/z:ro
      - Y:/:/mnt/y:ro
    ports:
      - "${DASHBOARD_PORT:-5151}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Memory cap so a runaway face_recognition batch can't OOM the host.
          memory: 8G
          # CPU cap — face detection is single-threaded per worker. With
          # index_workers=1 we use up to 1 CPU core for detection; cap at 2.0
          # to leave one for the reaper + uvicorn + everything else. Bump if
          # you want faster crawl, lower if your machine feels sluggish.
          cpus: "2.0"

  dashboard:
    build:
      context: ./operations-dashboard
      dockerfile: Dockerfile
    container_name: facetracker-dashboard
    ports:
      - "8701:8700"
    environment:
      - APP_ENV=production
    restart: unless-stopped

networks:
  default:
    name: facetracker-net

volumes:
  redis_data:
  model_cache:
